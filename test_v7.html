<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Raman Database and Literature</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1.5.10/css/pico.min.css">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.7.0/dist/nouislider.min.css">
		<script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.0/dist/nouislider.min.js"></script>
	<style>
		#biomoleculeOptions, #specificationOptions {
			margin-top: 4em;
		}
		/* Reduce noUiSlider bar height to 30% of default */
		.noUi-target {
			height: 0.3em !important;
			border: none !important;
			box-shadow: none !important;
			background: #fff !important;
		}
		.noUi-connect, .noUi-base {
			height: 100% !important;
			position: absolute;
			top: 0;
			left: 0;
			transform: none;
		}
		/* Custom triangle handles for noUiSlider */
		.noUi-handle {
			width: 1.6em !important;
			height: 1.12em !important;
			top: -0.58em !important;
			background: transparent !important;
			border: none !important;
			box-shadow: none !important;
			cursor: pointer;
			outline: none !important;
		}
		.noUi-handle:before {
			content: '';
			display: block;
			width: 1.2em;
			height: 0.84em;
			margin: 0em auto;
			background: none;
			clip-path: polygon(20% 0%, 80% 0%, 50% 100%);
			background-color: #666;
			transition: transform 0.2s;
		}
		.noUi-handle:after {
			content: none !important;
			display: none !important;
		}
		.noUi-handle-lower:before {
			transform: rotate(-90deg);
			margin-left: -0.9em;
		}
		.noUi-handle-upper:before {
			transform: rotate(90deg);
			margin-left: -0.2em;
		}
		/* Move noUiSlider tooltips below the slider */
		.noUi-tooltip {
			top: 36px !important;
			bottom: auto !important;
			background: #222;
			color: #fff;
			border-radius: 4px;
			font-size: 1em;
			padding: 0.2em 0.7em;
			box-shadow: 0 2px 8px rgba(0,0,0,0.12);
		}
		/* Remove all vertical lines and artifacts from noUiSlider */
		.noUi-origin {
			background: transparent !important;
			border: none !important;
			box-shadow: none !important;
		}
		.noUi-marker, .noUi-marker-large { background: transparent !important; }
		.noUi-value, .noUi-value-large { display: none !important; }
		.noUi-pips { display: none !important; }
		.noUi-base::before, .noUi-base::after,
		.noUi-target::before, .noUi-target::after,
		.noUi-origin::before, .noUi-origin::after { display: none !important; }
		.noUi-connect {
			border-left: none !important;
			border-right: none !important;
		}

		/* Table styling for PDF export (PRINT ONLY) */
		@media print {
			table { border-collapse: collapse; }
			th, td { border: 1px solid #888 !important; padding: 0.5em; }
		}
		/* On-screen: no table cell outlines */
		@media screen {
			table, th, td { border: none !important; }
		}

		/* Accelerate theme transitions for specific elements only */
		#searchInput, #downloadBtn, #clearSearch, #themeToggle {
			transition: color 0.05s ease, background-color 0.05s ease !important;
		}
	</style>
	<style>
		/* Lit# column */
		th.lit-col, td.lit-col {
			min-width: 10em;
			white-space: nowrap;
		}
	</style>
	<style>
		@media screen {
			/* Intensity: 1st visible column */
			#tableContainer table th:nth-child(1),
			#tableContainer table td:nth-child(1) {
				padding-left: 0.25em !important;
				padding-right: 0.25em !important;
			}
			/* Lit# (7) */
			#tableContainer table th:nth-child(7),
			#tableContainer table td:nth-child(7) { white-space: nowrap; }
		}
	</style>

	<!-- Inter font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

	<style>
		:root {
			font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
			--accent: #9BC09C;
			--accent2: #511d43;
		}
		html, body { font-family: inherit; }

		a, a:visited { color: var(--accent) !important; }
		a:hover, a:focus { color: var(--accent) !important; text-decoration-color: var(--accent) !important; }

		#searchBtn {
			background: var(--accent) !important;
			border: 1px solid var(--accent) !important;
			color: #fff !important;
		}
	</style>

	<style>
		/* Header row styling (screen) */
		@media screen {
			#tableContainer table {
				border-collapse: separate !important;
				border-spacing: 0.45em 0.05em;
				table-layout: fixed;
				width: max-content;
				min-width: 100%;
			}
			#tableContainer table th {
				background: transparent !important;
				padding: 0 !important;
				position: relative;
			}
			#tableContainer table th .th-pill {
				display: block;
				width: 100%;
				box-sizing: border-box;
				text-align: inherit;
				background: var(--accent2);
				color: #fff;
				border-radius: 0.6em;
				padding: 0.5em 0.7em;
				line-height: 1.1;
				background-clip: padding-box;
				text-transform: capitalize;
				font-weight: 540;
			}
			#tableContainer table th .th-pill .header-flex {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.3em;
				line-height: inherit;
				width: 100%;
			}
			#tableContainer table th .th-pill .header-flex > button {
				flex: 0 0 auto;
				width: 1.2em !important;
				height: 1.2em !important;
				min-width: 1.2em !important;
				min-height: 1.2em !important;
				padding: 0 !important;
				margin: 0 !important;
				line-height: 1 !important;
				display: inline-flex;
				align-items: center;
				justify-content: center;
			}
			#tableContainer table th .th-pill .header-flex > button svg {
				display: block;
				height: 1.05em;
				width: 1.05em;
			}
		}
	</style>
	<!-- Stable column classes -->
	<style>
		.col-intensity { }
		.col-wavenumber { }
		.col-biomolecule { }
		.col-specification { }
		.col-component { }
		.col-vibration { }
		.col-literature {
			white-space: nowrap;
		}
		.col-further1, .col-further2 {
			display: table-cell !important;
			white-space: normal;
		}
	</style>
	<style>
		@media screen {
			/* Header-to-data gap */
			#tableContainer table thead tr:first-child > th {
				padding-bottom: 0.9em !important;
			}
			/* Align search row */
			:root {
				--intensity-col-width: 2.5em;
				--table-col-gap-x: 0.45em;
			}
			#searchBarRow {
				padding-left: var(--table-col-gap-x);
				box-sizing: border-box;
			}
		}
	</style>
	<style>
		/* Light mode */
		html[data-theme="light"] {
			--background-color: #eff5ef;
			--pico-background-color: #eff5ef;
			--pico-color: #000;
			--pico-h1-color: #000; --pico-h2-color: #000; --pico-h3-color: #000;
			--pico-h4-color: #000; --pico-h5-color: #000; --pico-h6-color: #000;
			--pico-muted-color: #000;
		}
		html[data-theme="light"],
		html[data-theme="light"] body {
			background-color: #eff5ef !important;
			color: #000 !important;
		}
		html[data-theme="light"] h1, html[data-theme="light"] h2, html[data-theme="light"] h3,
		html[data-theme="light"] h4, html[data-theme="light"] h5, html[data-theme="light"] h6,
		html[data-theme="light"] p, html[data-theme="light"] label, html[data-theme="light"] small,
		html[data-theme="light"] li, html[data-theme="light"] th, html[data-theme="light"] td,
		html[data-theme="light"] input, html[data-theme="light"] button,
		html[data-theme="light"] select, html[data-theme="light"] textarea {
			color: #000 !important;
		}
		html[data-theme="light"] #filterBtn { color: #fff !important; }
		html[data-theme="light"] #filterBtn svg { stroke: #fff !important; }
	</style>
	<style>
		/* Accent focus states */
		#searchInput:focus, #searchInput:active {
			border-color: var(--accent) !important;
			outline: none !important;
			box-shadow: 0 0 0 0.2rem rgba(155, 192, 156, 0.25) !important;
		}
		#searchBtn:focus, #searchBtn:active, #searchBtn:hover {
			background: var(--accent) !important;
			border-color: var(--accent) !important;
			box-shadow: 0 0 0 0.2rem rgba(155, 192, 156, 0.25) !important;
		}
		.noUi-connect { background: var(--accent) !important; }
		input[type="checkbox"]:checked {
			background-color: var(--accent) !important;
			border-color: var(--accent) !important;
		}
		input[type="checkbox"]:focus {
			border-color: var(--accent) !important;
			box-shadow: 0 0 0 0.2rem rgba(155, 192, 156, 0.25) !important;
		}
		#filterBtn:focus, #filterBtn:active, #filterBtn:hover {
			background: var(--accent) !important;
			box-shadow: 0 0 0 0.2rem rgba(155, 192, 156, 0.25) !important;
		}
	</style>
	<!-- Download format dropdown -->
	<style>
		#downloadMenu {
			display: none;
			flex-direction: column;
			justify-content: center;
			align-items: stretch;
			gap: 0.1em;
			position: absolute;
			top: 3em;
			right: 1rem;
			min-width: 10rem;
			background: var(--background-color, #111);
			border: 1px solid rgba(255,255,255,0.2);
			border-radius: 0.35em;
			box-shadow: 0 10px 24px rgba(0,0,0,0.25);
			padding: 0.25em;
			z-index: 2000;
		}
		html[data-theme="light"] #downloadMenu {
			background: #fff;
			border-color: rgba(0,0,0,0.15);
		}
		#downloadMenu button {
			width: 100%;
			text-align: left;
			background: transparent;
			border: none;
			padding: 0.3em 0.45em !important;
			margin: 0 !important;
			border-radius: 0.35em;
			cursor: pointer;
			color: inherit;
			line-height: 1.2;
			font-size: 0.95em;
			box-sizing: border-box;
		}
		#downloadMenu button:hover {
			background: rgba(155, 192, 156, 0.15);
		}
	</style>
	<style>
		html[data-theme="dark"] #filterMenu { background: #222 !important; color: #eee !important; }
		html[data-theme="light"] #filterMenu { background: #fff !important; color: #222 !important; }
	</style>
	<!-- Wavenumber tolerance number input (filter popup) -->
	<style>
		.number-input {
			display: inline-flex;
			align-items: stretch;
			border: 1px solid var(--accent);
			border-radius: 0.35em;
			clip-path: inset(0 round 0.35em);
			width: fit-content;
			height: 2rem;
			flex: none;
		}
		#wnTolerance.number-input-field {
			width: 3rem;
			flex: none;
			box-sizing: border-box;
			height: 2rem !important;
			border: none;
			border-radius: 0;
			text-align: center;
			-moz-appearance: textfield;
			padding: 0 !important;
			margin: 0 !important;
			font-size: 0.9rem;
			line-height: normal;
			background: transparent;
			color: inherit;
		}
		.number-input-stepper {
			display: flex;
			flex-direction: column;
			flex: none;
			width: 1.4rem;
			height: 100%;
			border-left: 1px solid var(--accent);
		}
		.number-input-btn {
			appearance: none;
			-webkit-appearance: none;
			background: var(--accent);
			color: #fff;
			border: none;
			border-radius: 0;
			flex: 1 1 0;
			width: 100%;
			min-height: 0;
			font-size: 0.65rem;
			line-height: 1;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0;
			margin: 0;
		}
		.number-input-btn-up { border-bottom: 1px solid rgba(255,255,255,0.4); }
		.number-input-btn:hover, .number-input-btn:focus {
			filter: brightness(0.92);
			outline: none;
		}
		.number-input-field::-webkit-outer-spin-button,
		.number-input-field::-webkit-inner-spin-button {
			-webkit-appearance: none;
			margin: 0;
		}
		.number-input-field:focus {
			outline: none;
			box-shadow: none;
		}
	</style>
	<!-- Sticky search bar and table header -->
	<style>
		#searchBarRow {
			position: sticky;
			top: 0;
			z-index: 60;
			padding-top: 0.5em;
			padding-bottom: 0.5em;
		}
		html[data-theme="light"] #searchBarRow {
			background: #eff5ef !important;
		}
		html[data-theme="dark"] #searchBarRow {
			background: #11191f !important;
		}
		#tableContainer table thead {
			position: sticky;
			z-index: 50;
		}
		#tableContainer table thead th {
			/* opaque background so content doesn't bleed through */
		}
		html[data-theme="light"] #tableContainer table thead th {
			background: #eff5ef !important;
		}
		html[data-theme="dark"] #tableContainer table thead th {
			background: #11191f !important;
		}
		/* Ensure the th-pill keeps its styling on top of the opaque background */
		#tableContainer table thead th .th-pill {
			position: relative;
			z-index: 1;
		}
	</style>
	<!-- Column resize handles -->
	<style>
		#tableContainer table td {
			overflow: hidden;
			text-overflow: ellipsis;
		}
		#tableContainer table th {
			position: relative;
			overflow: visible;
		}
		.col-resize-handle {
			position: absolute;
			right: -5px;
			top: 0;
			bottom: 0;
			width: 3px;
			cursor: col-resize;
			z-index: 20;
			background: transparent;
			user-select: none;
			-webkit-user-select: none;
		}
		.col-resize-handle:hover,
		.col-resize-handle.active {
			background: var(--accent);
			opacity: 0.5;
			border-radius: 3px;
		}
		body.col-resizing {
			cursor: col-resize !important;
			user-select: none !important;
			-webkit-user-select: none !important;
		}
		body.col-resizing * {
			cursor: col-resize !important;
		}
	</style>
	<style>
		#citationBox {
			padding: 0.8em;
			border: 1.5px solid var(--accent);
			border-radius: 0.5em;
			font-size: 0.82em;
			line-height: 1.4;
			text-align: center;
			max-width: 16rem;
			flex-shrink: 0;
			margin-top: 2.5rem;
			position: relative;
			z-index: 70;
		}
		html[data-theme="dark"] #citationBox {
			background: #511d4362;
			color: #eee;
		}
		html[data-theme="light"] #citationBox {
			background: #511d4332;
			color: #222;
		}
		#headerRow {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: 0.5rem;
			flex-wrap: wrap;
			padding-right: 6rem;
			margin-bottom: -1.5rem;
			overflow: visible;
			position: relative;
		}
		#headerRow h2 {
			margin-bottom: 0;
			margin-top: 0;
			padding-top: 1.5rem;
			padding-left: 0.50em
		}
		#overviewGraphContainer {
			display: none;
			position: absolute;
			width: 460px;
			box-sizing: border-box;
			padding: 0.4em 0.5em 0.2em;
			border: 1.5px solid var(--accent);
			border-radius: 0.5em;
			z-index: 70;
			cursor: zoom-in;
		}
		html[data-theme="dark"] #overviewGraphContainer {
			background: #511d4362;
			color: #eee;
		}
		html[data-theme="light"] #overviewGraphContainer {
			background: #511d4332;
			color: #222;
		}
		#overviewGraphTitle {
			font-size: 0.72em;
			text-align: center;
			margin-bottom: 0.2em;
			opacity: 0.85;
		}
		#overviewGraphModal {
			display: none;
			position: fixed;
			inset: 0;
			background: rgba(0,0,0,0.45);
			z-index: 2000;
			align-items: center;
			justify-content: center;
		}
		#overviewGraphModalPanel {
			resize: both;
			overflow: hidden;
			width: 640px;
			height: 420px;
			min-width: 320px;
			min-height: 240px;
			max-width: 95vw;
			max-height: 90vh;
			border: 1.5px solid var(--accent);
			border-radius: 0.5em;
			padding: 1.2em 1em 1em;
			position: relative;
			display: flex;
			flex-direction: column;
			box-shadow: 0 4px 24px rgba(0,0,0,0.35);
		}
		html[data-theme="dark"] #overviewGraphModalPanel {
			background: #2a0f24;
			color: #eee;
		}
		html[data-theme="light"] #overviewGraphModalPanel {
			background: #fdf6fb;
			color: #222;
		}
		#overviewGraphModalClose {
			position: absolute;
			top: 0.3em;
			right: 0.5em;
			background: none;
			border: none;
			cursor: pointer;
			font-size: 1.3em;
			line-height: 1;
			color: inherit;
		}
		#overviewGraphModalTitle {
			text-align: center;
			font-weight: 600;
			margin-bottom: 0.4em;
			flex-shrink: 0;
		}
		#overviewModalCanvas {
			flex: 1;
			width: 100%;
			height: 100%;
		}
	</style>
</head>
<body>
	<nav style="position: absolute; top: 1rem; right: 1rem; z-index: 100;">
		<button id="downloadBtn" title="Download" style="background: none; border: none; cursor: pointer; padding: 0.2em 0.5em; margin-right: 0.5em;">
			<svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
				<line x1="14" y1="4" x2="14" y2="18"/>
				<polyline points="8 14 14 20 20 14"/>
				<line x1="6" y1="24" x2="22" y2="24"/>
			</svg>
		</button>
		<div id="downloadMenu" role="menu" aria-label="Download options">
			<button id="downloadPdfBtn" type="button" role="menuitem">Export as PDF</button>
			<button id="downloadTxtBtn" type="button" role="menuitem">Export as TXT</button>
		</div>
		<button id="themeToggle" aria-label="Toggle dark mode" style="background: none; border: none; cursor: pointer; padding: 0;">
			<span id="themeIcon">
				<svg id="sunIcon" width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<circle cx="14" cy="14" r="5"/>
					<line x1="14" y1="2" x2="14" y2="6"/><line x1="14" y1="22" x2="14" y2="26"/>
					<line x1="2" y1="14" x2="6" y2="14"/><line x1="22" y1="14" x2="26" y2="14"/>
					<line x1="5.1" y1="5.1" x2="7.8" y2="7.8"/><line x1="20.2" y1="20.2" x2="22.9" y2="22.9"/>
					<line x1="5.1" y1="22.9" x2="7.8" y2="20.2"/><line x1="20.2" y1="7.8" x2="22.9" y2="5.1"/>
				</svg>
				<svg id="moonIcon" width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
					<path d="M24 14A10 10 0 1 1 14 4c0 8 2.5 10 10 10z"/>
				</svg>
			</span>
		</button>
	</nav>
	<div id="headerRow">
		<h2>Raman Peak Literature Database </h2>
		<div id="overviewGraphContainer" title="Double-click to enlarge">
			<div id="overviewGraphTitle"></div>
			<canvas id="overviewCanvas"></canvas>
		</div>
		<div id="citationBox">
			If you use this database, please cite the Database Review:<br><br>
			<em>https://github.com/semabdemir/Raman-database-for-biological-spectra</em>
		</div>
	</div>

	<div id="overviewGraphModal">
		<div id="overviewGraphModalPanel">
			<button type="button" id="overviewGraphModalClose" aria-label="Close">&times;</button>
			<div id="overviewGraphModalTitle"></div>
			<canvas id="overviewModalCanvas"></canvas>
		</div>
	</div>

	<div id="searchBarRow">
		<label for="searchInput" style="display:none;"></label>
		<div style="display: flex; align-items: center; width: 100%; position: relative;">
			<div style="position: relative; width: 33%; min-width: 220px;">
				<input type="text" id="searchInput" placeholder="Search Wavenumber or Category" autocomplete="off" style="width: 100%; padding-right: 2em;">
				<button id="clearSearch" aria-label="Clear search" style="position: absolute; right: 0.5em; top: 50%; transform: translateY(-90%); background: none; border: none; cursor: pointer; padding: 0; width: 1.2em; height: 1.2em; display: flex; align-items: center; justify-content: center;">
					<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<line x1="5" y1="5" x2="15" y2="15"/><line x1="15" y1="5" x2="5" y2="15"/>
					</svg>
				</button>
			</div>
			<button id="searchBtn" style="margin-left: 0.5em; font-size: 0.9em; padding: 0.2em 0.7em; min-width: 0; width: auto; white-space: nowrap; background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: 0.3em;">Search</button>
			<button id="filterBtn" style="margin-left: 0.5em; font-size: 0.9em; padding: 0.2em 0.7em; min-width: 0; width: auto; white-space: nowrap; background: var(--accent); color: #fff; border: none; border-radius: 0.3em; display: flex; align-items: center; gap: 0.3em;">
				<span style="display: flex; align-items: center;">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><line x1="4" y1="21" x2="20" y2="21"/><line x1="8" y1="17" x2="16" y2="17"/><line x1="10" y1="13" x2="14" y2="13"/><line x1="12" y1="3" x2="12" y2="13"/></svg>
				</span>
				Filter
			</button>
			<div id="filterMenu" style="display:none; position:absolute; top:3.5em; right:2em; border:1px solid var(--accent); border-radius:0.5em; box-shadow:0 2px 12px rgba(25,118,210,0.15); padding:1em; z-index:1000; min-width:320px;">
				<div style="margin-bottom:1em;">
					<div style="margin-bottom:1em; display:flex; align-items:center; gap:0.3em;">
						<div class="number-input">
							<input type="number" id="wnTolerance" class="number-input-field" value="10" min="0" step="1" inputmode="numeric">
							<div class="number-input-stepper">
								<button type="button" id="wnToleranceInc" class="number-input-btn number-input-btn-up" aria-label="Increase search range">+</button>
								<button type="button" id="wnToleranceDec" class="number-input-btn number-input-btn-down" aria-label="Decrease search range">&minus;</button>
							</div>
						</div>
						<button type="button" id="wnToleranceInfoBtn" title="Show description" style="background:transparent;color:var(--accent);border:none;width:1.2em;height:1.2em;min-width:1.2em;min-height:1.2em;font-size:1em;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:none;padding:0;margin:0">
							<svg viewBox="0 0 19 19" fill="none" aria-hidden="true" style="display:block;width:1.05em;height:1.05em;"><circle cx="9.5" cy="9.5" r="8.5" stroke="var(--accent)" stroke-width="1" fill="none"/><text x="9.5" y="10.2" font-size="13" font-family="Inter" fill="var(--accent)" text-anchor="middle" dominant-baseline="middle">?</text></svg>
						</button>
					</div>
					<div id="wavenumberSliderContainer" style="margin-bottom:1em;">
						<div id="wnSlider" style="margin: 1em 0;"></div>
					</div>
					<div id="biomoleculeOptions"></div>
					<div id="specificationOptions"></div>
				</div>
			</div>
		</div>
		<ul id="autocompleteList" style="position: absolute; left: 0; top: 100%; width: 100%; border-radius: 0.25em; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 10; list-style: none; margin: 0; padding: 0; display: none;"></ul>
	</div>
	<div id="searchResults"></div>
	<div id="tableContainer"></div>
	<script>

	let allRows = [];
	let litRows = [];
	let beschreibungRows = [];
	let beschreibungMap = {};
	let autocompleteOptions = [];
	let resolvedLitForPdf = []; // Stores [{num, citation, source, measurement}, ...] after async resolve
	let currentLitSources = []; // Current render's literature sources (always in sync with displayed table)
	let resolvedCitationsByDoi = {}; // Cache: doi -> resolved APA citation string
	let globalLitSources = []; // Stable global literature list (built once from all rows)
	let globalLitMap = {};     // Stable global DOI -> literature number mapping

	function normalizeDoi(doi) {
		return (doi || '').trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i, '');
	}

	function extractDoisFromRow(row) {
		const cells = row.split('\t');
		const dois = [];
		for (const raw of cells) {
			const s = (raw || '').trim();
			if (!s) continue;
			const parts = s.split(/[;,|]/g).map(p => p.trim()).filter(Boolean);
			for (let part of parts) {
				part = normalizeDoi(part);
				if (/^10\.\d{4,9}\/\S+$/i.test(part) && !dois.includes(part)) dois.push(part);
			}
		}
		return dois;
	}

	function buildGlobalLitMap() {
		globalLitSources = [];
		globalLitMap = {};
		if (!litRows || litRows.length <= 1 || !allRows || allRows.length <= 1) return;

		// Parse literature file
		const litHeader = litRows[0].split('\t').map(h => h.trim().toLowerCase());
		let authorIdx = litHeader.findIndex(h => h === 'author' || h === 'authors');
		if (authorIdx === -1) authorIdx = litHeader.findIndex(h => h.includes('author'));
		let yearIdx = litHeader.findIndex(h => h === 'year');
		let sourceIdx = litHeader.findIndex(h => h === 'source');
		let measurementIdx = litHeader.findIndex(h => h === 'measurement');
		let doiIdx = litHeader.findIndex(h => h === 'doi');
		const litData = {};
		litRows.slice(1).forEach(row => {
			const cells = row.split('\t');
			const doiRaw = doiIdx !== -1 ? (cells[doiIdx] || '').trim() : '';
			const doi = normalizeDoi(doiRaw);
			if (doi) {
				litData[doi] = {
					doi,
					author: authorIdx !== -1 ? (cells[authorIdx] || '').trim() : '',
					year: yearIdx !== -1 ? (cells[yearIdx] || '').trim() : '',
					source: sourceIdx !== -1 ? (cells[sourceIdx] || '').trim() : '',
					measurement: measurementIdx !== -1 ? (cells[measurementIdx] || '').trim() : ''
				};
				litHeader.forEach((h, idx) => {
					if (!(h in litData[doi])) litData[doi][h] = (cells[idx] || '').trim();
				});
			}
		});

		// Collect all DOIs referenced in ALL database rows
		const seenDois = new Set();
		allRows.slice(1).forEach(row => {
			extractDoisFromRow(row).forEach(doi => {
				if (doi && litData[doi] && !seenDois.has(doi)) {
					seenDois.add(doi);
					globalLitSources.push(litData[doi]);
				}
			});
		});
		// Sort stably by author then year
		globalLitSources.sort((a, b) => {
			if (a.author < b.author) return -1;
			if (a.author > b.author) return 1;
			return a.year.localeCompare(b.year);
		});
		// Assign stable numbers
		globalLitSources.forEach((src, idx) => { globalLitMap[src.doi] = idx + 1; });
	}

	function normalizeDbRows(rows) {
		if (!Array.isArray(rows) || rows.length === 0) return rows;
		const stripBom = (s) => (s ?? '').toString().replace(/^\uFEFF/, '');
		const isBlank = (line) => !stripBom(line).trim();
		const isWnCell = (s) => {
			const v = stripBom(s).trim().replace(/[–—]/g, '-').split('-')[0].trim();
			return Number.isFinite(parseFloat(v));
		};
		let start = 0;
		while (start < rows.length && isBlank(rows[start])) start++;
		if (start >= rows.length) return [];
		const header = stripBom(rows[start]);
		const headerNorm = header.trim().toLowerCase();
		let i = start + 1;
		while (i < rows.length) {
			if (isBlank(rows[i])) { i++; continue; }
			const line = stripBom(rows[i]);
			const norm = line.trim().toLowerCase();
			if (norm === headerNorm) { i++; continue; }
			const firstCell = (line.split('\t')[0] || '').trim();
			if (isWnCell(firstCell)) break;
			i++;
		}
		return [header, ...rows.slice(i).map(stripBom)];
	}

	function getWavenumberRange() {
		if (!allRows || allRows.length <= 1) return { min: 0, max: 5000 };
		const data = allRows.slice(1);
		function parseWn(row) {
			const v = parseFloat((row.split('\t')[0] || '').trim());
			return Number.isFinite(v) ? v : null;
		}
		let min = null;
		for (let i = 0; i < data.length; i++) { const v = parseWn(data[i]); if (v !== null) { min = v; break; } }
		let max = null;
		for (let i = data.length - 1; i >= 0; i--) { const v = parseWn(data[i]); if (v !== null) { max = v; break; } }
		if (min === null || max === null) return { min: 0, max: 5000 };
		return { min, max };
	}

	function getSortWavenumber(row) {
		const cell = (row.split('\t')[0] || '').trim();
		if (!cell) return Number.POSITIVE_INFINITY;
		const norm = cell.replace(/[–—]/g, '-');
		const left = norm.split('-')[0].trim();
		const v = parseFloat(left);
		return Number.isFinite(v) ? v : Number.POSITIVE_INFINITY;
	}

	function sortRowsByWavenumber(rows) {
		if (!rows || rows.length <= 1) return rows;
		const header = rows[0];
		const data = rows.slice(1).slice().sort((a, b) => getSortWavenumber(a) - getSortWavenumber(b));
		return [header, ...data];
	}

	// Returns the currently selected biomolecule/specification/wavenumber-range filter state
	function getActiveFilterState() {
		const checkedBiomols = new Set();
		const checkedSpecs = new Set();
		document.querySelectorAll('.biomol-group input[type="checkbox"][id^="bio_"]:checked').forEach(box => {
			checkedBiomols.add(box.value);
		});
		document.querySelectorAll('.biomol-group .spec-list input[type="checkbox"][id^="spec_"]:checked').forEach(box => {
			checkedSpecs.add(box.value);
		});
		const hasBiomolCheckboxes = document.querySelectorAll('.biomol-group input[type="checkbox"][id^="bio_"]').length > 0;
		const minWn = window.filterWnMin ?? getWavenumberRange().min;
		const maxWn = window.filterWnMax ?? getWavenumberRange().max;
		return { checkedBiomols, checkedSpecs, hasBiomolCheckboxes, minWn, maxWn };
	}

	function rowMatchesFilterState(cells, filters) {
		const wn = parseFloat(cells[0]);
		if (isNaN(wn) || wn < filters.minWn || wn > filters.maxWn) return false;
		if (filters.hasBiomolCheckboxes) {
			const biomol = cells[2]?.trim();
			const spec = cells[3]?.trim();
			if (!filters.checkedBiomols.has(biomol)) return false;
			if (spec && !filters.checkedSpecs.has(spec)) return false;
		}
		return true;
	}

	function getSearchTolerance() {
		const el = document.getElementById('wnTolerance');
		if (!el) return 10;
		const v = parseInt(el.value, 10);
		return Number.isFinite(v) && v >= 0 ? v : 10;
	}

	function rowMatchesSearch(cells, searchVal) {
		if (!searchVal) return true;
		const wn = parseFloat(searchVal);
		if (!isNaN(wn)) {
			const tolerance = getSearchTolerance();
			const num = parseFloat(cells[0]);
			return !isNaN(num) && num >= wn - tolerance && num <= wn + tolerance;
		}
		const catVal = searchVal.toLowerCase();
		return (cells[2] && cells[2].toLowerCase().includes(catVal)) ||
			   (cells[3] && cells[3].toLowerCase().includes(catVal)) ||
			   (cells[4] && cells[4].toLowerCase().includes(catVal));
	}

	// --- Overview graph (left of the citation box) ---
	let lastOverviewFilteredRows = [];
	let lastOverviewSearchVal = '';

	function getIntensityPoints(intensity) {
		const v = (intensity || '').trim().toLowerCase();
		if (v === 'weak') return 1;
		if (v === 'medium') return 2;
		if (v === 'strong') return 3;
		return 0;
	}

	function countSourcesForRow(row) {
		return extractDoisFromRow(row).length;
	}

	function getChartColors() {
		const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
		return {
			axis: isDark ? '#ccc' : '#333',
			line: (getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()) || '#1976d2'
		};
	}

	function drawBarChart(canvas, labels, values) {
		const ctx = canvas.getContext('2d');
		const w = canvas.width, h = canvas.height;
		ctx.clearRect(0, 0, w, h);
		const colors = getChartColors();
		if (!labels.length) {
			ctx.fillStyle = colors.axis; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
			ctx.fillText('No data', w / 2, h / 2);
			return;
		}
		const padLeft = 26, padBottom = 34, padTop = 8, padRight = 6;
		const plotW = w - padLeft - padRight;
		const plotH = h - padTop - padBottom;
		const maxVal = Math.max(...values, 1);
		const barGap = 6;
		const barW = Math.max(4, (plotW - barGap * (labels.length - 1)) / labels.length);

		ctx.strokeStyle = colors.axis; ctx.lineWidth = 1;
		ctx.beginPath();
		ctx.moveTo(padLeft, padTop); ctx.lineTo(padLeft, padTop + plotH); ctx.lineTo(padLeft + plotW, padTop + plotH);
		ctx.stroke();

		ctx.fillStyle = colors.axis; ctx.font = '9px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
		ctx.fillText(String(maxVal), padLeft - 4, padTop + 4);
		ctx.fillText('0', padLeft - 4, padTop + plotH);

		labels.forEach((label, i) => {
			const val = values[i];
			const barH = (val / maxVal) * plotH;
			const x = padLeft + i * (barW + barGap);
			const y = padTop + plotH - barH;
			ctx.fillStyle = colors.line;
			ctx.fillRect(x, y, barW, barH);

			ctx.save();
			ctx.translate(x + barW / 2, padTop + plotH + 4);
			ctx.rotate(-Math.PI / 4);
			ctx.fillStyle = colors.axis; ctx.font = '8px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
			ctx.fillText(label.length > 14 ? label.slice(0, 13) + '…' : label, 0, 0);
			ctx.restore();
		});
	}

	// Returns tick values rounded to multiples of 100, with at least `minCount` ticks when the range allows
	function computeNiceTicks(minX, maxX, desiredCount) {
		const span = maxX - minX;
		if (span <= 0) return [Math.round(minX / 100) * 100];
		let step = Math.max(100, Math.round((span / (desiredCount - 1)) / 100) * 100);
		let ticks = [];
		while (step >= 100) {
			ticks = [];
			for (let v = Math.ceil(minX / step) * step; v <= maxX + 1e-6; v += step) ticks.push(v);
			if (ticks.length >= Math.min(desiredCount, 4) || step === 100) break;
			step -= 100;
		}
		return ticks;
	}

	// Savitzky-Golay (quadratic) smoothing, preserves peak shape better than a moving average
	function savitzkyGolaySmooth(values, windowSize) {
		windowSize = windowSize || 5;
		const coeffsMap = {
			5: [-3, 12, 17, 12, -3],
			7: [-2, 3, 6, 7, 6, 3, -2],
			9: [-21, 14, 39, 54, 59, 54, 39, 14, -21]
		};
		const coeffs = coeffsMap[windowSize] || coeffsMap[5];
		const norm = coeffs.reduce((a, b) => a + b, 0);
		const half = Math.floor(coeffs.length / 2);
		const n = values.length;
		if (n < coeffs.length) return values.slice();
		return values.map((_, i) => {
			let sum = 0;
			for (let k = -half; k <= half; k++) {
				let idx = i + k;
				if (idx < 0) idx = 0;
				if (idx >= n) idx = n - 1;
				sum += values[idx] * coeffs[k + half];
			}
			return sum / norm;
		});
	}

	function drawLineChart(canvas, xValues, yValues, opts) {
		opts = opts || {};
		const showPoints = opts.showPoints === true;
		const lineWidth = opts.lineWidth || 1;
		const ctx = canvas.getContext('2d');
		const w = canvas.width, h = canvas.height;
		ctx.clearRect(0, 0, w, h);
		const colors = getChartColors();
		if (!xValues.length) {
			ctx.fillStyle = colors.axis; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
			ctx.fillText('No data', w / 2, h / 2);
			return;
		}
		const padLeft = 28, padBottom = 24, padTop = 8, padRight = 6;
		const plotW = w - padLeft - padRight;
		const plotH = h - padTop - padBottom;
		// Always show the same fixed wavenumber window so charts are comparable across searches
		const minX = 200, maxX = 3100;
		const maxY = Math.max(...yValues, 1);
		const spanX = Math.max(1, maxX - minX);

		ctx.strokeStyle = colors.axis; ctx.lineWidth = 1;
		ctx.beginPath();
		ctx.moveTo(padLeft, padTop); ctx.lineTo(padLeft, padTop + plotH); ctx.lineTo(padLeft + plotW, padTop + plotH);
		ctx.stroke();

		ctx.fillStyle = colors.axis; ctx.font = '9px sans-serif';
		ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
		ctx.fillText(String(maxY), padLeft - 4, padTop + 4);
		ctx.fillText('0', padLeft - 4, padTop + plotH);

		const toX = v => padLeft + ((v - minX) / spanX) * plotW;
		const toY = v => padTop + plotH - (v / maxY) * plotH;

		ctx.textAlign = 'center'; ctx.textBaseline = 'top';
		computeNiceTicks(minX, maxX, 5).forEach(tickVal => {
			ctx.fillText(String(Math.round(tickVal)), toX(tickVal), padTop + plotH + 5);
		});

		const smoothedY = savitzkyGolaySmooth(yValues, 5);
		const points = xValues
			.map((x, i) => ({ x, y: smoothedY[i] }))
			.filter(p => p.x >= minX && p.x <= maxX)
			.map(p => ({ x: toX(p.x), y: toY(p.y) }));
		ctx.strokeStyle = colors.line; ctx.lineWidth = lineWidth;
		ctx.beginPath();
		if (points.length === 0) {
			// nothing within the fixed window to draw
		} else if (points.length === 1) {
			ctx.moveTo(points[0].x, points[0].y); ctx.lineTo(points[0].x, points[0].y);
		} else {
			ctx.moveTo(points[0].x, points[0].y);
			for (let i = 0; i < points.length - 1; i++) {
				const curr = points[i], next = points[i + 1];
				const midX = (curr.x + next.x) / 2, midY = (curr.y + next.y) / 2;
				ctx.quadraticCurveTo(curr.x, curr.y, midX, midY);
			}
			const last = points[points.length - 1];
			ctx.lineTo(last.x, last.y);
		}
		ctx.stroke();

		if (showPoints) {
			ctx.fillStyle = colors.line;
			points.forEach(p => {
				ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
			});
		}
	}

	// Histogram bin width (in wavenumber units) used for all text searches
	function getSearchBinSize(searchVal) {
		return 10;
	}

	// Computes the chart series (bar or line) from the currently filtered rows + search term
	function computeOverviewSeries(filteredDataRows, searchVal) {
		const isNumericSearch = !isNaN(parseFloat(searchVal)) && isFinite(searchVal);
		if (isNumericSearch) {
			const counts = {};
			filteredDataRows.forEach(row => {
				const cells = row.split('\t');
				const biomol = (cells[2] || '').trim();
				if (!biomol) return;
				counts[biomol] = (counts[biomol] || 0) + countSourcesForRow(row);
			});
			const labels = Object.keys(counts).sort();
			const values = labels.map(l => counts[l]);
			return { type: 'bar', labels, values, title: 'Sources per biomolecule' };
		}
		const binSize = getSearchBinSize(searchVal);
		const bins = {};
		filteredDataRows.forEach(row => {
			const cells = row.split('\t');
			const wn = parseFloat(cells[0]);
			if (!Number.isFinite(wn)) return;
			const weight = countSourcesForRow(row) * getIntensityPoints(cells[1]);
			if (!weight) return;
			const binIdx = Math.floor(wn / binSize);
			bins[binIdx] = (bins[binIdx] || 0) + weight;
		});
		const binIndices = Object.keys(bins).map(Number).sort((a, b) => a - b);
		if (!binIndices.length) return { type: 'line', xValues: [], yValues: [], title: 'Weighted entries by wavenumber' };
		// Build a dense, evenly-spaced series (filling empty bins with 0) so smoothing only
		// averages truly adjacent wavenumbers instead of flattening sparse, low-volume peaks
		const minIdx = binIndices[0], maxIdx = binIndices[binIndices.length - 1];
		const xValues = [], yValues = [];
		for (let idx = minIdx; idx <= maxIdx; idx++) {
			xValues.push(idx * binSize + binSize / 2);
			yValues.push(bins[idx] || 0);
		}
		return { type: 'line', xValues, yValues, title: 'Weighted entries by wavenumber' };
	}

	function renderOverviewSeries(canvas, series) {
		if (series.type === 'bar') drawBarChart(canvas, series.labels, series.values);
		else drawLineChart(canvas, series.xValues, series.yValues, { showPoints: false, lineWidth: 1 });
	}

	// Positions the small overview box so its top matches the citation box's top
	// and its bottom matches the search bar's bottom, shifted toward the citation box.
	function positionOverviewGraphContainer() {
		const container = document.getElementById('overviewGraphContainer');
		const citationBox = document.getElementById('citationBox');
		const headerRow = document.getElementById('headerRow');
		const searchBarRow = document.getElementById('searchBarRow');
		if (!container || !citationBox || !headerRow || !searchBarRow) return;
		const headerRect = headerRow.getBoundingClientRect();
		const citationRect = citationBox.getBoundingClientRect();
		const searchBarRect = searchBarRow.getBoundingClientRect();
		const top = citationRect.top - headerRect.top;
		const height = searchBarRect.bottom - citationRect.top;
		container.style.top = top + 'px';
		container.style.height = Math.max(40, height) + 'px';
		const gap = 14;
		const left = (citationRect.left - headerRect.left) - gap - container.offsetWidth;
		container.style.left = Math.max(8, left) + 'px';
	}

	function resizeCanvasToElement(canvas, availW, availH) {
		canvas.width = Math.max(80, Math.floor(availW));
		canvas.height = Math.max(50, Math.floor(availH));
	}

	function resizeOverviewCanvasToContainer() {
		const container = document.getElementById('overviewGraphContainer');
		const canvas = document.getElementById('overviewCanvas');
		const titleEl = document.getElementById('overviewGraphTitle');
		if (!container || !canvas || !titleEl) return;
		const style = getComputedStyle(container);
		const padX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
		const padY = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
		resizeCanvasToElement(canvas, container.clientWidth - padX, container.clientHeight - padY - titleEl.offsetHeight - 4);
	}

	async function autoLoadFiles() {
		try {
			const [dbRes, litRes, beschreibungRes] = await Promise.all([
				fetch(dbUrl), fetch(litUrl), fetch(beschreibungUrl)
			]);
			if (!dbRes.ok || !litRes.ok || !beschreibungRes.ok) throw new Error('Failed to fetch one or more files.');

			async function responseToText(res) {
				const buf = await res.arrayBuffer();
				const bytes = new Uint8Array(buf);
				if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf);
				if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf);
				return new TextDecoder('utf-8').decode(buf);
			}

			const dbText = await responseToText(dbRes);
			const litText = await responseToText(litRes);
			const beschreibungText = await responseToText(beschreibungRes);

			allRows = dbText.trim().split(/\r?\n/);
			allRows = normalizeDbRows(allRows);
			allRows = sortRowsByWavenumber(allRows);

			litRows = litText.trim().split(/\r?\n/);
			beschreibungRows = beschreibungText.trim().split(/\r?\n/);
			beschreibungMap = {};
			beschreibungRows.forEach(row => {
				const cells = row.split('\t');
				if (cells.length >= 2) {
					let cleanKey = cells[0].replace(/[\x00-\x1F\u200B-\u200D\uFEFF]/g, '').trim();
					let cleanVal = cells[1].replace(/[\x00-\x1F\u200B-\u200D\uFEFF]/g, '').trim();
					beschreibungMap[cleanKey] = cleanVal;
				}
			});
			const opts = new Set();
			allRows.slice(1).forEach(row => {
				const cells = row.split('\t');
				[2,3,4].forEach(idx => { if (cells[idx] && cells[idx].trim()) opts.add(cells[idx].trim()); });
			});
			autocompleteOptions = Array.from(opts).sort();
			delete window.filterWnMin;
			delete window.filterWnMax;
			buildGlobalLitMap();
			renderTableAndLiterature(allRows, litRows);
		} catch (e) {
			alert('Error loading files: ' + e.message);
		}
	}

				e.preventDefault();

							var innerW = (data.cell && typeof data.cell.width === 'number' ? data.cell.width : litColWidths[data.column.index]) - 6;
							if (!innerW || innerW <= 10) return;
							var text = insertSoftBreaks((data.cell.text || []).join(' ')).trim();
							if (!text) return;
							pdf.setFontSize(data.cell.styles.fontSize ||  6);
							data.cell.text = wrapTextToWidth(pdf, text, innerW);
						}
					});

				}

				var searchTerm = (document.getElementById('searchInput').value.trim()) || 'results';
				pdf.save('RamanData_' + searchTerm + '.pdf');
			} catch (err) {
				console.error('PDF export failed:', err && err.message ? err.message : err);
				if (err && err.stack) console.error(err.stack);
				alert('PDF export failed. Check console.');
			}
		}
		if (downloadPdfBtn) downloadPdfBtn.addEventListener('click', function() { closeMenu(); exportPdf(); });
		if (downloadTxtBtn) downloadTxtBtn.addEventListener('click', function() { closeMenu(); exportTxt(); });
	});
	</script>

	<script>
		window.addEventListener('error', function(e) {
			console.error('Runtime error:', e.message, e.filename + ':' + e.lineno + ':' + e.colno);
		});
	</script>
</body>
</html>
